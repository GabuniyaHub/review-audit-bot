name: Android tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  logic:
    name: Audit logic (512 reviews)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run deterministic audit tests
        run: node --test android/tests/*.test.mjs

  android:
    name: APK build and Android integration
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      ANDROID_LIVE_LLM: 'false'
      ANDROID_SERIAL: emulator-5554
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android build tools
        run: sdkmanager 'platforms;android-35' 'build-tools;36.0.0'
      - name: Build signed APK without credentials
        run: bash android/build.sh
      - name: Enable emulator hardware acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run Android offline integration tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot-save -camera-back none
          script: bash android/test-device.sh
      - name: Upload APK without API key
        uses: actions/upload-artifact@v4
        with:
          name: reputation-audit-ci-no-api-key
          path: android/build/reputation-audit.apk
          if-no-files-found: error
          retention-days: 7
